[package]
name = "hypermid-sdk"
version = "0.3.0"
edition = "2021"
description = "Rust SDK for the Hypermid Partner API — swap, bridge & on-ramp across 90+ chains"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Hypermid/hypermid-sdk-rs"
keywords = ["hypermid", "cross-chain", "swap", "bridge", "sdk"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
